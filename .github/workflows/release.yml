name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        run: node scripts/validate-release-version.mjs "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm run release:checksums
      - name: Build operator-facing release notes from the changelog
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" > artifacts/RELEASE_NOTES.md
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/openclaw-quota-pilot-*.tgz \
            artifacts/openclaw-quota-pilot-vscode-*.vsix \
            artifacts/SHA256SUMS \
            scripts/install-release.sh \
            --verify-tag \
            --notes-file artifacts/RELEASE_NOTES.md \
            --title "Quota Pilot ${GITHUB_REF_NAME}"
