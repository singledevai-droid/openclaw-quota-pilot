name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        run: node scripts/validate-release-version.mjs "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm run release:checksums
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/openclaw-quota-pilot-*.tgz \
            artifacts/openclaw-quota-pilot-vscode-*.vsix \
            artifacts/SHA256SUMS \
            scripts/install-release.sh \
            --verify-tag \
            --generate-notes \
            --title "Quota Pilot ${GITHUB_REF_NAME}"
